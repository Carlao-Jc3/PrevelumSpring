<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Prevélum - Cadastro de Produtos</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>

        <div class="container">
            <!-- Menu lateral -->
            <aside class="sidebar">
                <h1>Prevélum</h1>

                <button onclick="irParaListagem()">Listagem</button>
                <button onclick="cadastrarProduto()">Cadastrar</button>
                <button onclick="limparCampos()">Limpar</button>
            </aside>

            <!-- Conteúdo principal -->
            <main class="content">
                <h2>Cadastro de Produtos</h2>

                <form id="cadastroForm">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome">

                    <label for="preco">Preço médio</label>
                    <input type="number" id="preco" step="0.01">

                    <label for="estoque">Estoque inicial</label>
                    <input type="number" id="estoque">

                    <label for="fornecedor">Fornecedor</label>
                    <input type="text" id="fornecedor">
                </form>
            </main>
        </div>

        <script src="js/cadastro.js"></script>
    </body>
</html>
